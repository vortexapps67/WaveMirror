<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream - WaveMirror</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Custom Watch CSS overrides -->
    <style>
        .watch-container {
            max-width: 1240px;
            margin: 80px auto 40px;
            padding: 0 1.5rem;
        }
        .watch-header-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }
        .watch-player-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            margin-bottom: 2rem;
        }
        .watch-details-section {
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }
        @media (max-width: 992px) {
            .watch-details-section {
                grid-template-columns: 1fr;
            }
            .watch-container {
                margin-top: 85px;
                padding: 0 1rem;
            }
            .watch-header-nav {
                padding: 0 1rem;
            }
        }
    </style>
</head>
<body style="background-color: var(--bg-dark); color: #fff;">
    <div class="watch-header-nav">
        <a href="./" style="display: flex; align-items: center; gap: 0.6rem; text-decoration: none;">
            <img src="9dff5f12-e1c4-4575-81f4-5184844ca983.png" alt="WaveMirror" style="height: 36px;">
            <span style="font-family: var(--font-heading); font-size: 1.4rem; font-weight: 700; color: #fff; letter-spacing: -0.5px;">Wave<span style="color: var(--primary-cyan);">Mirror</span></span>
        </a>
        <div style="display: flex; gap: 0.8rem; align-items: center;">
            <a href="./" class="btn-secondary" style="padding: 0.45rem 1rem; font-size: 0.85rem; border-color: var(--border-glass); justify-content: center; text-decoration: none;">
                🏠 Back to Catalog
            </a>
        </div>
    </div>

    <div class="watch-container">
        <!-- Main Video Player Card -->
        <div class="watch-player-card">
            <!-- Popup Shield Header Bar & Quick Control Deck -->
            <div class="shield-bar">
                <div class="shield-status-pill">
                    <span class="status-dot-live"></span>
                    <span id="shieldStatus">🛡️ Popup Shield Active</span>
                </div>
                <div class="player-quick-tools">
                    <button class="btn-tool" onclick="toggleCinemaLights()" id="cinemaLightsBtn" title="Dim surrounding lights">
                        💡 Lights
                    </button>
                    <button class="btn-tool" onclick="closeAdOverlay()" title="Clear overlays and refresh stream">
                        ⚡ Clear Ads
                    </button>
                    <button class="btn-tool" id="modalWatchPartyBtn" onclick="startWatchPartyFromPlayer()" style="border-color: var(--primary-cyan); color: #fff;">
                        🍿 Watch Party
                    </button>
                </div>
            </div>

            <!-- Resume Where You Left Off Prompt Banner -->
            <div id="resumePlaybackBanner" class="resume-banner" style="display: none;">
                <div class="resume-text">
                    <span style="font-size: 1.2rem;">⚡</span>
                    <span id="resumeBannerText">You left off at <strong>00:00</strong>. Pick up where you left off?</span>
                </div>
                <div class="resume-actions">
                    <button class="btn-primary" style="padding: 0.35rem 0.9rem; font-size: 0.8rem;" onclick="confirmResumePlayback()">▶ Resume</button>
                    <button class="btn-secondary" style="padding: 0.35rem 0.8rem; font-size: 0.8rem;" onclick="dismissResumePlayback()">↺ Start Over</button>
                </div>
            </div>

            <!-- Video Player Ambient Glow & Box -->
            <div class="player-ambient-wrap">
                <div class="player-ambient-glow"></div>
                <div class="player-wrapper" id="playerWrapper" style="width: 100%; aspect-ratio: 16/9; background: #000; position: relative;">
                    <iframe class="player-iframe" id="playerIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen style="width:100%; height:100%; border:none;"></iframe>
                </div>
            </div>
        </div>

        <!-- TV Controls (Season & Episode Selectors) -->
        <div id="tvControls" class="tv-controls-bar hidden" style="display: none;">
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.6rem;">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label style="font-size: 0.85rem; font-weight: 700; color: var(--primary-cyan);">Season:</label>
                    <select id="seasonSelect" onchange="updateTvStream()" class="select-dropdown"></select>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label style="font-size: 0.85rem; font-weight: 700; color: var(--primary-cyan);">Episode:</label>
                    <select id="episodeSelect" onchange="updateTvStream()" class="select-dropdown"></select>
                </div>
            </div>
        </div>

        <!-- Server Switcher Bar -->
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 1rem;">
            <div class="server-switcher" id="serverSwitcher" style="margin-bottom: 0; display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <button class="server-btn active" onclick="loadServer(1, this)">Server 1 (vidlink.pro)</button>
                <button class="server-btn" onclick="loadServer(2, this)">Server 2 (vidsrc.xyz)</button>
                <button class="server-btn" onclick="loadServer(3, this)">Server 3 (vidsrc.cc)</button>
                <button class="server-btn" onclick="loadServer(4, this)">Server 4 (autoembed.cc)</button>
            </div>
            <span style="font-size: 0.75rem; color: var(--primary-cyan); font-weight: 600;">⚡ Instant Engine Switch</span>
        </div>

        <!-- Bookmark / Progress Bar -->
        <div class="bookmark-bar" style="margin-bottom: 1.5rem;">
            <span style="font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.45rem;">
                ⏱️ Elapsed: <strong id="playerSessionTimeDisplay" style="color: var(--primary-cyan); font-size: 0.9rem;">00:00</strong>
                <span id="playerSavedBookmarkNotice" style="color: var(--text-dim); margin-left: 0.4rem;">(Auto-saved)</span>
            </span>
            <div style="display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap;">
                <button class="time-jump-btn" onclick="adjustSessionTime(-300)" title="Rewind 5 minutes">-5m</button>
                <button class="time-jump-btn" onclick="adjustSessionTime(300)" title="Forward 5 minutes">+5m</button>
                <input type="text" id="manualBookmarkInput" placeholder="Time (e.g. 45:20)" class="bookmark-input">
                <button class="btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.75rem;" onclick="saveManualBookmark()">🔖 Bookmark</button>
            </div>
        </div>

        <!-- Media Info Details -->
        <div class="watch-details-section">
            <div>
                <h1 id="modalTitle" style="font-family: var(--font-heading); font-size: 2.2rem; font-weight: 700; color: #fff; margin-bottom: 0.4rem; letter-spacing: -0.5px;">Loading Stream...</h1>
                <div style="display: flex; gap: 1rem; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.2rem;" id="modalMeta">
                    <span id="modalYear">----</span>
                    <span id="modalRating" style="color: var(--primary-gold); font-weight: 700;">★ --</span>
                    <span id="modalDuration">--m</span>
                </div>
                <p id="modalOverview" style="font-size: 0.95rem; line-height: 1.6; color: var(--text-main); font-weight: 300; margin-bottom: 1.5rem;">Connecting to stream servers...</p>
                
                <div style="display: flex; gap: 0.8rem; margin-top: 1.5rem; flex-wrap: wrap;">
                    <button class="btn-primary" id="modalWatchlistBtn" onclick="handleWatchlistToggle()">+ Add to Watchlist</button>
                </div>
                </div>
            </div>
            
            <div style="background: var(--bg-card); border: 1px solid var(--border-glass); padding: 1.4rem; border-radius: var(--radius-md);">
                <h3 style="font-size: 1rem; font-family: var(--font-heading); margin-bottom: 1rem; color: #fff;">Stream Info</h3>
                <div style="display: flex; flex-direction: column; gap: 0.9rem; font-size: 0.85rem;">
                    <div>
                        <span style="color: var(--text-muted); display: block; margin-bottom: 0.2rem;">Director</span>
                        <strong id="modalDirector" style="color: #fff; font-weight: 600;">--</strong>
                    </div>
                    <div>
                        <span style="color: var(--text-muted); display: block; margin-bottom: 0.2rem;">Starring</span>
                        <strong id="modalCast" style="color: #fff; font-weight: 500;">--</strong>
                    </div>
                    <div>
                        <span style="color: var(--text-muted); display: block; margin-bottom: 0.2rem;">Genres</span>
                        <strong id="modalGenres" style="color: var(--primary-cyan); font-weight: 500;">--</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="watch.js"></script>
</body>
</html>
